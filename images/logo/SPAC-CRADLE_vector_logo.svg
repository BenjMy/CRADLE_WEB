<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
  version="1.1">

  <title>SPAC-CRADLE Logo</title>
  <desc>Clean, fully vector logo with the SPAC-CRADLE wordmark and five suspended scientific/environmental icons.</desc>

  <defs>
    <style>
      .bar { fill:#303943; }
      .hanger { fill:none; stroke:#303943; stroke-width:10; stroke-linecap:round; }
      .icon-stroke { fill:none; stroke:#ffffff; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
      .wordmark { font-family:Montserrat,Arial,sans-serif; font-size:126px; font-weight:700; letter-spacing:7px; fill:#303943; }
    </style>
  </defs>

  <!-- Wordmark -->
  <g id="wordmark" inkscape:label="SPAC-CRADLE wordmark">
    <text x="800" y="175" text-anchor="middle" class="wordmark">SPAC-CRADLE</text>
  </g>

  <!-- Cradle / support -->
  <g id="support" inkscape:label="Cradle support">
    <rect x="205" y="235" width="1190" height="28" rx="14" class="bar"/>
    <line x1="330" y1="263" x2="330" y2="550" class="hanger"/>
    <line x1="565" y1="263" x2="565" y2="550" class="hanger"/>
    <line x1="800" y1="263" x2="800" y2="550" class="hanger"/>
    <line x1="1035" y1="263" x2="1035" y2="550" class="hanger"/>
    <line x1="1270" y1="263" x2="1360" y2="550" class="hanger"/>
  </g>

  <!-- Icon 1: particles / layers -->
  <g id="icon-particles" inkscape:label="Particles icon">
    <circle cx="330" cy="650" r="108" fill="#9f0034"/>
    <path d="M258 625 C280 642 301 642 322 625 C343 608 364 608 385 625 C406 642 427 642 448 625" class="icon-stroke"/>
    <g fill="#ffffff">
      <circle cx="270" cy="663" r="6"/>
      <circle cx="302" cy="653" r="6"/>
      <circle cx="335" cy="667" r="6"/>
      <circle cx="368" cy="653" r="6"/>
      <circle cx="401" cy="670" r="6"/>
      <circle cx="285" cy="690" r="6"/>
      <circle cx="318" cy="705" r="6"/>
      <circle cx="350" cy="691" r="6"/>
      <circle cx="383" cy="708" r="6"/>
      <circle cx="415" cy="694" r="6"/>
    </g>
  </g>

  <!-- Icon 2: roots -->
  <g id="icon-roots" inkscape:label="Roots icon">
    <circle cx="565" cy="650" r="108" fill="#e5003d"/>
    <path d="M565 575 L565 635
             M565 610 C548 628 535 637 520 642
             M565 610 C582 628 595 637 610 642
             M565 635 C548 651 540 670 535 700
             M565 635 C582 651 590 670 595 700
             M545 650 C527 662 515 677 508 694
             M585 650 C603 662 615 677 622 694
             M565 650 C565 674 565 695 565 720
             M550 670 C539 685 533 700 530 715
             M580 670 C591 685 597 700 600 715" class="icon-stroke"/>
  </g>

  <!-- Icon 3: spectrum / data -->
  <g id="icon-spectrum" inkscape:label="Spectrum icon">
    <circle cx="800" cy="650" r="108" fill="#2f8f00"/>
    <g class="icon-stroke">
      <line x1="758" y1="590" x2="758" y2="710"/>
      <line x1="782" y1="590" x2="782" y2="710"/>
      <line x1="806" y1="590" x2="806" y2="710"/>
      <line x1="830" y1="590" x2="830" y2="710"/>
    </g>
    <g fill="#ffffff">
      <circle cx="851" cy="603" r="6"/>
      <circle cx="851" cy="625" r="6"/>
      <circle cx="851" cy="647" r="6"/>
      <circle cx="851" cy="669" r="6"/>
      <circle cx="851" cy="691" r="6"/>
    </g>
  </g>

  <!-- Icon 4: leaf -->
  <g id="icon-leaf" inkscape:label="Leaf icon">
    <circle cx="1035" cy="650" r="108" fill="#008b7b"/>
    <path d="M1035 705
             C988 682 976 634 995 604
             C1012 578 1048 577 1072 595
             C1094 612 1097 648 1080 674
             C1066 695 1049 703 1035 705 Z" class="icon-stroke"/>
    <path d="M1035 705 C1040 668 1049 635 1071 600" class="icon-stroke"/>
  </g>

  <!-- Icon 5: weather -->
  <g id="icon-weather" inkscape:label="Weather icon">
    <circle cx="1360" cy="650" r="108" fill="#0968c8"/>
    <g class="icon-stroke">
      <path d="M1312 682
               C1293 682 1279 669 1279 651
               C1279 632 1294 618 1312 618
               C1319 596 1338 584 1360 584
               C1384 584 1404 599 1410 621
               C1429 621 1444 634 1444 652
               C1444 669 1430 682 1413 682 Z"/>
      <circle cx="1390" cy="603" r="24"/>
      <line x1="1390" y1="565" x2="1390" y2="550"/>
      <line x1="1390" y1="656" x2="1390" y2="641"/>
      <line x1="1347" y1="603" x2="1333" y2="603"/>
      <line x1="1433" y1="603" x2="1448" y2="603"/>
      <line x1="1359" y1="572" x2="1348" y2="561"/>
      <line x1="1421" y1="634" x2="1432" y2="645"/>
      <line x1="1421" y1="572" x2="1432" y2="561"/>
    </g>
  </g>

</svg>
